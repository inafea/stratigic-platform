<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الإستراتيجية التجارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        .main-box {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            max-width: 700px;
            margin: 60px auto;
            padding: 40px 30px 30px 30px;
        }
        h1 {
            background: linear-gradient(135deg, #e94560 0%, #f39c12 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            font-size: 2.3em;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        label {
            font-weight: 700;
            color: #1a1a2e;
        }
        textarea {
            min-height: 120px;
            font-size: 1.1em;
            background: #f9f9f9;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #e94560;
            background: #fff;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #f39c12 100%);
            border: none;
            font-weight: 700;
            font-size: 1.1em;
            border-radius: 12px;
            padding: 12px 40px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #f39c12 0%, #e94560 100%);
        }
        .result-box {
            background: #f9f9f9;
            border-right: 5px solid #e94560;
            border-radius: 15px;
            padding: 30px 20px;
            margin-top: 30px;
            font-size: 1.15em;
            line-height: 2.1;
            color: #333;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .alert-danger {
            margin-top: 20px;
            font-weight: 600;
            animation: shake 0.3s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .loading-container {
            display: none;
            text-align: center;
            padding: 40px 20px;
            margin-top: 30px;
        }
        .loading-container.show {
            display: block;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e94560;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #666;
            font-weight: 600;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="main-box">
        <h1>محلل الإستراتيجية التجارية</h1>
        <div class="subtitle">مدعوم بالذكاء الاصطناعي - أدخل فكرتك وأهدافك التجارية</div>
        <form id="analyzerForm">
            <div class="mb-3">
                <label for="businessIdea" class="form-label">فكرتك التجارية:</label>
                <textarea class="form-control" id="businessIdea" name="businessIdea" required placeholder="صف فكرتك التجارية بالتفصيل..."></textarea>
            </div>
            <div class="mb-3">
                <label for="businessGoals" class="form-label">أهدافك التجارية:</label>
                <textarea class="form-control" id="businessGoals" name="businessGoals" required placeholder="ما هي أهدافك التجارية؟"></textarea>
            </div>
            <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-primary" id="submitBtn">تحليل باستخدام الذكاء الاصطناعي</button>
                <button type="reset" class="btn btn-secondary" id="resetBtn">حذف</button>
            </div>
        </form>

        <!-- Loading Spinner -->
        <div class="loading-container" id="loadingContainer">
            <div class="spinner"></div>
            <p class="loading-text">جاري تحليل استراتيجيتك التجارية...</p>
        </div>

        <!-- Error Message -->
        <div id="errorContainer"></div>

        <!-- Results -->
        <div id="resultContainer"></div>
    </div>

    <script>
        document.getElementById('analyzerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const idea = document.getElementById('businessIdea').value.trim();
            const goals = document.getElementById('businessGoals').value.trim();
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const resultContainer = document.getElementById('resultContainer');
            
            // Clear previous results
            errorContainer.innerHTML = '';
            resultContainer.innerHTML = '';
            
            // Show loading
            loadingContainer.classList.add('show');
            
            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'businessIdea': idea,
                        'businessGoals': goals
                    })
                });
                
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Hide loading
                loadingContainer.classList.remove('show');
                
                // Check for error
                const errorElement = doc.getElementById('errorContainer').innerHTML;
                if (errorElement) {
                    errorContainer.innerHTML = errorElement;
                } else {
                    // Display result
                    const resultElement = doc.getElementById('resultContainer').innerHTML;
                    resultContainer.innerHTML = resultElement;
                }
            } catch (error) {
                loadingContainer.classList.remove('show');
                errorContainer.innerHTML = `<div class="alert alert-danger">خطأ في الاتصال. يرجى المحاولة مرة أخرى.</div>`;
            }
        });
        
        // Reset form and clear results
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('errorContainer').innerHTML = '';
            document.getElementById('resultContainer').innerHTML = '';
        });
    </script>
</body>
</html>
