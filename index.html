<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الإستراتيجية التجارية - مدعوم بالذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            max-width: 1000px;
            width: 100%;
            padding: 50px;
            backdrop-filter: blur(10px);
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #e94560 0%, #f39c12 100%);
            border-radius: 2px;
        }

        h1 {
            color: #1a1a2e;
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 900;
            background: linear-gradient(135deg, #e94560 0%, #f39c12 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-top: 30px;
            font-weight: 400;
        }

        .form-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .form-group::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 50px;
            background: linear-gradient(180deg, #e94560 0%, transparent 100%);
            border-radius: 2px;
        }

        label {
            color: #1a1a2e;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label::before {
            content: '';
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #e94560 0%, #f39c12 100%);
            border-radius: 50%;
            display: inline-block;
        }

        textarea {
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1em;
            resize: vertical;
            min-height: 180px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        textarea:focus {
            outline: none;
            border-color: #e94560;
            background: white;
            box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.1);
            transform: translateY(-2px);
        }

        .button-group {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 16px 50px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            text-transform: none;
        }

        .btn-submit {
            background: linear-gradient(135deg, #e94560 0%, #f39c12 100%);
            color: white;
            flex: 1;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.4);
        }

        .btn-submit:active {
            transform: translateY(-2px);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
            flex: 1;
            max-width: 350px;
        }

        .btn-clear:hover {
            background: #e0e0e0;
            border-color: #d0d0d0;
        }

        .results-section {
            display: none;
            margin-top: 50px;
            padding-top: 50px;
            border-top: 3px solid #e0e0e0;
        }

        .results-section.active {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-section h2 {
            color: #1a1a2e;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 900;
            background: linear-gradient(135deg, #e94560 0%, #f39c12 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading {
            text-align: center;
            padding: 60px 40px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e94560;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #666;
            font-size: 1.1em;
            font-weight: 600;
        }

        .result-content {
            background: linear-gradient(135deg, #f9f9f9 0%, #f0f0f0 100%);
            padding: 35px;
            border-radius: 15px;
            line-height: 2;
            color: #555;
            border-right: 5px solid #e94560;
        }

        .result-content h3 {
            color: #1a1a2e;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.4em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-content h3::before {
            content: '';
            width: 6px;
            height: 6px;
            background: linear-gradient(135deg, #e94560 0%, #f39c12 100%);
            border-radius: 50%;
            display: inline-block;
        }

        .result-content p {
            margin-bottom: 18px;
            color: #666;
            font-weight: 500;
        }

        .result-content ul, .result-content ol {
            margin-right: 25px;
            margin-bottom: 18px;
        }

        .result-content li {
            margin-bottom: 12px;
            color: #666;
            font-weight: 500;
        }

        .error {
            background: linear-gradient(135deg, #fee8ea 0%, #ffe8e8 100%);
            border: 2px solid #f88;
            color: #c33;
            padding: 25px;
            border-radius: 12px;
            margin-top: 25px;
            display: none;
            border-right: 5px solid #e94560;
            font-weight: 600;
        }

        .error.active {
            display: block;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .info-box {
            background: linear-gradient(135deg, #e8f4f8 0%, #e8f0f8 100%);
            border-right: 4px solid #e94560;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #555;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .form-section {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .button-group {
                flex-direction: column;
                gap: 15px;
            }

            .btn-submit, .btn-clear {
                max-width: none;
            }

            .container {
                padding: 30px;
            }

            .results-section h2 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 محلل الإستراتيجية التجارية</h1>
            <p class="subtitle">مدعوم بالذكاء الاصطناعي - حول أفكارك التجارية إلى استراتيجية ناجحة</p>
        </header>

        <form id="analyzerForm">
            <div class="form-section">
                <div class="form-group">
                    <label for="businessIdea">فكرتك التجارية:</label>
                    <textarea id="businessIdea" placeholder="صف فكرتك التجارية بالتفصيل. ما المشكلة التي تحلها؟ من هو سوقك المستهدف؟" required></textarea>
                </div>

                <div class="form-group">
                    <label for="businessGoals">أهدافك التجارية:</label>
                    <textarea id="businessGoals" placeholder="ما هي أهدافك التجارية؟ ماذا تريد تحقيقه في السنة القادمة أو الثلاث سنوات المقبلة؟" required></textarea>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">تحليل باستخدام الذكاء الاصطناعي</button>
                <button type="reset" class="btn-clear">حذف</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>جاري تحليل استراتيجيتك التجارية...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results-section" id="results">
            <h2>📊 نتائج تحليل الذكاء الاصطناعي</h2>
            <div class="result-content" id="resultContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
